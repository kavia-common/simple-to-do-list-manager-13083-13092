<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Food - 602-1233</title>
  <meta name="viewport" content="width=375, initial-scale=1.0">
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./my-food-602-1233.css">
</head>
<body>
  <div class="screen-my-food-602-1233">
    <div class="root-panel abs" style="left:0;top:0;"></div>

    <!-- Top header -->
    <div class="top-wrap abs">
      <div class="back-circle abs" aria-hidden="true"></div>
      <div class="back-icon abs" aria-hidden="true"></div>
      <div class="title abs">My Food List</div>
    </div>

    <!-- Tabs (All / Breakfast / Lunch / Dinner) -->
    <div class="tabs-wrap abs" aria-label="Food categories">
      <div class="tabs-divider abs" aria-hidden="true"></div>
      <div class="tab-all abs">All</div>
      <div class="tab-breakfast abs">Breakfast</div>
      <div class="tab-lunch abs">Lunch</div>
      <div class="tab-dinner abs">Dinner</div>
      <div class="tab-active-underline abs" aria-hidden="true"></div>
    </div>

    <!-- Total items -->
    <div class="total-items abs">Total 03 items</div>

    <!-- Food 1 -->
    <div class="food-row food-1 abs" role="group" aria-label="Chicken Thai Biriyani">
      <div class="thumb abs" aria-hidden="true"></div>
      <div class="kebab abs" aria-hidden="true">
        <div class="dot dot-1 abs"></div>
        <div class="dot dot-2 abs"></div>
        <div class="dot dot-3 abs"></div>
      </div>
      <div class="food-title abs">Chicken Thai Biriyani</div>
      <div class="chip-wrap abs">
        <div class="chip-bg abs" aria-hidden="true"></div>
        <div class="chip-text abs">Breakfast</div>
      </div>
      <div class="rating-wrap abs" aria-label="Rating 4.9 out of 5 with 10 reviews">
        <div class="star abs" aria-hidden="true"></div>
        <div class="rating-score abs">4.9</div>
        <div class="rating-reviews abs">(10 Review)</div>
      </div>
      <div class="pickup abs"> Pick UP</div>
      <div class="price abs">$60</div>
    </div>

    <!-- Food 2 -->
    <div class="food-row food-2 abs" role="group" aria-label="Chicken Bhuna">
      <div class="thumb abs" aria-hidden="true"></div>

        <div class="dot dot-1 abs"></div>
        <div class="dot dot-2 abs"></div>
        <div class="dot dot-3 abs"></div>
      </div>
      <div class="food-title abs">Chicken Bhuna</div>
      <div class="chip-wrap abs">
        <div class="chip-bg abs" aria-hidden="true"></div>
        <div class="chip-text abs">Breakfast</div>
      </div>
      <div class="rating-wrap abs" aria-label="Rating 4.9 out of 5 with 10 reviews">
        <div class="star abs" aria-hidden="true"></div>
        <div class="rating-score abs">4.9</div>
        <div class="rating-reviews abs">(10 Review)</div>
      </div>
      <div class="pickup abs"> Pick UP</div>
      <div class="price abs">$30</div>
    </div>

    <!-- Food 3 -->
    <div class="food-row food-3 abs" role="group" aria-label="Mazalichiken Halim">
      <div class="thumb abs" aria-hidden="true"></div>
      <div class="kebab abs" aria-hidden="true">
        <div class="dot dot-1 abs"></div>
        <div class="dot dot-2 abs"></div>
        <div class="dot dot-3 abs"></div>
      </div>
      <div class="food-title abs">Mazalichiken Halim</div>
      <div class="chip-wrap abs">
        <div class="chip-bg abs" aria-hidden="true"></div>
        <div class="chip-text abs">Breakfast</div>
      </div>
      <div class="rating-wrap abs" aria-label="Rating 4.9 out of 5 with 10 reviews">
        <div class="star abs" aria-hidden="true"></div>
        <div class="rating-score abs">4.9</div>
        <div class="rating-reviews abs">(10 Review)</div>
      </div>
      <div class="pickup abs"> Pick UP</div>
      <div class="price abs">$25</div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="bottom-tab abs" role="navigation" aria-label="Bottom tabs">
      <div class="bottom-bg abs" aria-hidden="true"></div>

      <div class="icon-grid abs" aria-label="Grid">
        <div class="sq sq-1 abs"></div>
        <div class="sq sq-2 abs"></div>
        <div class="sq sq-3 abs"></div>
        <div class="sq sq-4 abs"></div>
      </div>

      <div class="icon-menu abs" aria-label="Menu">
        <div class="line line-1 abs"></div>
        <div class="line line-2 abs"></div>
        <div class="line line-3 abs"></div>
      </div>

      <div class="icon-bell abs" aria-label="Notifications">
        <div class="bell-body abs"></div>
        <div class="bell-clapper abs"></div>
      </div>

      <div class="icon-user abs" aria-label="Profile">
        <div class="user-base abs"></div>
        <div class="user-head abs"></div>
      </div>

      <div class="fab-wrap abs">
        <div class="fab-bg abs" aria-hidden="true"></div>
        <div class="fab-plus abs">
          <div class="vline abs"></div>
